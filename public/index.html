<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surgical Scheduling</title>
<style>
:root{
  /* palette: Mauve Dust, Bluebell Frost, Venus Flower, Green Beryl, Duck Egg, Forest Frolic */
  --mauve:#CB96BA;--bluebell:#B0B3D6;--venus:#E0E4E7;--beryl:#D0DDC4;--duck:#9BBCAC;--forest:#77A39A;
  --bg:#EFF5F3;--dot:rgba(119,163,154,.32);--card:#FCFEFD;--fg:#1f2f2c;--mu:#566a66;--bd:#C6D4D0;--ink:#16302c;--ad:#3d6a62;
  --hl:#E9F1EE;--pt:#2e1a28;--ok:#2a7550;--wn:#8a560e;--er:#b3382e;--focus:#3d6a62;
  --t-sched-bg:#E4E5F3;--t-sched:#3a3d73;--t-ready-bg:#E2EDDA;--t-done-bg:#E0E4E7;--t-bad-bg:#F7E3E0;--t-wn-bg:#F7EAD3;--t-cf-bg:#FDF5F4;--t-cf-bd:#E5B9B3;
  --shadow:0 1px 2px rgba(22,48,44,.06),0 4px 14px rgba(22,48,44,.04);
  color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#162120;--dot:rgba(155,188,172,.18);--card:#1f2d2c;--fg:#e3ecea;--mu:#9db3ae;--bd:#34484a;--ad:#9BBCAC;--hl:#263634;
  --ok:#6fd69a;--wn:#e8a444;--er:#ff8f85;--focus:#9BBCAC;--t-sched-bg:#33355a;--t-sched:#cfd1f0;--t-ready-bg:#2c4636;--t-done-bg:#2c3a3a;--t-bad-bg:#4a2a28;--t-wn-bg:#473819;--t-cf-bg:#2b2020;--t-cf-bd:#6b3b36;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:12px 12px}
button,select,input{font:inherit;color:var(--fg)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- top bar & navigation ---------- */
header.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 20px;padding:10px 22px;background:var(--forest);color:var(--ink);box-shadow:0 2px 10px rgba(22,48,44,.15)}
.brand{display:flex;align-items:center;gap:10px;line-height:1.15}
.brand small{display:block;opacity:.8;font-size:12px}
.logo{width:34px;height:34px;border-radius:10px;background:#FCFEFD;display:grid;place-items:center;color:var(--forest)}
.tabs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.tabs button{white-space:nowrap;border:0;background:none;padding:9px 18px;border-radius:99px;color:var(--ink);font-weight:600;cursor:pointer;opacity:.85}
.tabs button:hover{background:rgba(255,255,255,.3);opacity:1}
.tabs button[aria-current=page]{background:#FCFEFD;opacity:1;box-shadow:0 1px 4px rgba(22,48,44,.2)}
.who{display:flex;align-items:center;gap:10px}
.who .nm{line-height:1.15;text-align:right}.who .nm small{display:block;font-size:12px;opacity:.8}
.av{width:36px;height:36px;border-radius:50%;background:var(--mauve);color:var(--pt);display:grid;place-items:center;font-weight:700;font-size:13px}
@media(max-width:900px){header.top{grid-template-columns:1fr auto;padding:10px 14px}.tabs{grid-column:1/-1;order:3;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.tabs button{padding:8px 10px;font-size:14px}.who .nm{display:none}}
main{max-width:1180px;margin:0 auto;padding:24px 20px 24px}
footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--mu);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--forest);background:var(--hl)}
.btn.pri{background:var(--mauve);border-color:var(--mauve);color:var(--pt)}.btn.pri:hover{background:#c284ae;border-color:#c284ae}
.btn.sm{min-height:34px;padding:5px 12px;font-size:14px}
.btn.danger{color:var(--er)}.btn.danger:hover{background:var(--t-bad-bg);border-color:var(--er)}
.btn.onbar{background:rgba(255,255,255,.35);border-color:transparent;color:var(--ink)}.btn.onbar:hover{background:#FCFEFD}
.lnk{border:0;background:none;color:var(--ad);font-weight:600;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
select,input{min-height:40px;padding:8px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);width:100%}
select:disabled{opacity:.7}
label{display:block;font-size:13px;font-weight:600;color:var(--mu)}label>*{display:block;margin-top:4px;font-weight:400}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;color:var(--mu);font-weight:600;cursor:pointer;min-height:34px}
.seg button:hover:not(:disabled){background:var(--hl)}
.seg button[aria-pressed=true]{background:var(--forest);color:var(--ink)}
.seg button:disabled{cursor:default;opacity:.65}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-items:end}
.inl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.inl select,.inl input{width:auto;min-width:0}.inl input[type=number]{width:84px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar input,.bar select{width:auto}

/* ---------- cards, boxes, tags ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2,.cardhead h2{font-size:18px;margin:0 0 12px;color:var(--ad)}
.cardhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
h3{font-size:14px;margin:18px 0 8px}
.mu{color:var(--mu)}.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}
.box{padding:10px 14px;border-radius:12px;border:1.5px solid currentColor;margin:10px 0;line-height:1.6}
.box b{display:block}
.box .lnk{float:right;color:inherit}
.b{display:inline-flex;align-items:center;padding:2px 11px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.b.sched{background:var(--t-sched-bg);color:var(--t-sched)}.b.ready{background:var(--t-ready-bg);color:var(--ok)}.b.done{background:var(--t-done-bg);color:var(--mu)}
.b.canc,.b.cf{background:var(--t-bad-bg);color:var(--er)}.b.wait{background:var(--t-wn-bg);color:var(--wn)}.b.urg{border-color:var(--wn);color:var(--wn)}.b.emg{border-color:var(--er);color:var(--er)}
.b.out{border-color:currentColor;background:none}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--hl);border:1px solid var(--bd);border-radius:99px;padding:2px 4px 2px 11px;font-size:13px;margin:0 6px 6px 0}
.chip button{border:0;background:none;color:var(--er);cursor:pointer;padding:0 6px;font-size:16px;line-height:1}

/* ---------- bookings home ---------- */
.hero{background:var(--beryl);border-color:var(--duck);color:#1d3a2c}
.hero h1{margin:0;font-size:24px;line-height:1.2}.hero p{margin:4px 0 0;color:#355247}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;cursor:default;color:var(--fg)}
button.tile{cursor:pointer}button.tile:hover{border-color:var(--er)}
.tile b{display:block;font-size:28px;line-height:1.1}.tile span{font-size:13px;color:var(--mu)}
.banner{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:14px;border:1.5px solid currentColor;margin-bottom:18px;background:var(--card)}
.banner b{color:var(--fg)}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px}.sec h2{margin:0;font-size:17px;color:var(--ad)}.sec i{flex:1;height:1px;background:var(--bd)}
.cnt{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:0 10px;font-size:13px;font-weight:600}
.bk{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:6px 18px;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.bk.cf{background:var(--t-cf-bg);border-color:var(--t-cf-bd)}.bk.cd{opacity:.82}
.when{background:var(--hl);border-radius:10px;padding:8px 10px;text-align:center;line-height:1.3}.when b{display:block}.when span{font-size:13px;color:var(--mu)}
.bk h3{margin:0;font-size:16px}.bk .meta{font-size:13px;color:var(--mu)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:860px){.bk{grid-template-columns:1fr}.when{text-align:left;display:flex;gap:10px;align-items:baseline}.acts{justify-content:flex-start}}
.empty{padding:22px;text-align:center;color:var(--mu);border:1.5px dashed var(--bd);border-radius:14px;background:var(--card)}

/* ---------- surgery detail ---------- */
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--mu);font-size:14px}
.trow{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:grid;gap:8px;background:var(--card)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}

/* ---------- map, tables, meters ---------- */
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--forest);color:var(--ink);text-align:left;font-weight:700}th,td{padding:8px 10px;border:1px solid var(--bd);vertical-align:top}
tbody tr:nth-child(even){background:var(--hl)}
.meter{height:12px;background:var(--hl);border:1px solid var(--bd);border-radius:6px;overflow:hidden;min-width:120px}.meter i{display:block;height:100%;background:var(--forest)}
.mgrid{min-width:780px}.mrow{display:flex;align-items:stretch;margin-bottom:6px}.mlab{width:96px;flex:none;padding:4px 6px 4px 0;display:flex;flex-direction:column;justify-content:center}.mlab small,.blk small,.bed small{display:block;color:var(--mu);font-size:11px}
.mtrack{position:relative;flex:1;display:flex;height:60px;border:1px solid var(--bd);border-radius:10px;background:var(--card);overflow:hidden}.mhead .mtrack{height:auto;border:0;background:none}.mhead span{flex:2;font-size:11px;color:var(--mu)}
.slot{flex:1;border:0;border-left:1px dashed var(--bd);border-radius:0;background:none;padding:0;cursor:pointer}.slot:hover:not(:disabled){background:var(--hl);box-shadow:inset 0 0 0 2px var(--forest)}.slot.pk{background:var(--forest);opacity:.35}
.maint .mtrack{background:repeating-linear-gradient(45deg,var(--hl),var(--hl) 8px,var(--bd) 8px,var(--bd) 10px)}.maint .slot{cursor:not-allowed}
.blk{position:absolute;white-space:nowrap;text-overflow:ellipsis;border-radius:8px;padding:3px 8px;font-size:12px;line-height:1.25;color:#16302c;overflow:hidden;cursor:pointer;background:var(--bluebell);border:0;text-align:left}.blk small{color:#16302c;opacity:.85}
.blk.Ready{background:var(--duck)}.blk.Completed{background:var(--venus)}.blk.Urgent{outline:2px solid var(--wn);outline-offset:-2px}.blk.Emergency{outline:2px solid var(--er);outline-offset:-2px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:8px 0}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.bed{border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:13px;background:var(--card)}.bed.free{border-color:var(--ok)}.bed.occ{background:var(--hl);border-color:var(--wn)}
code.t{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--hl);border-radius:6px;padding:1px 6px;font-size:13px}

/* ---------- sign in / sign up ---------- */
.authwrap{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;max-width:980px;margin:0 auto;padding:44px 20px;align-items:center}
.authwrap h1{font-size:34px;line-height:1.15;margin:0 0 12px;color:var(--ad)}
.pts{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:12px}
.pts li{display:flex;gap:12px;align-items:flex-start}.pts i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--ink)}
.demo{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.form{display:grid;gap:14px}
.err{padding:10px 14px;border-radius:12px;border:1.5px solid var(--er);color:var(--er);margin-bottom:14px}
@media(max-width:820px){.authwrap{grid-template-columns:1fr;padding:24px 16px}.authwrap h1{font-size:28px}}

/* ---------- modal & toast ---------- */
.ov{position:fixed;inset:0;background:rgba(22,48,44,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto}
.dlg{background:var(--card);border-radius:18px;padding:22px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg h2{margin-top:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:92%;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;display:none;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.bad{background:var(--er)}
</style></head><body>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="api.js"></script>
<script src="app.js"></script>
</body></html>
